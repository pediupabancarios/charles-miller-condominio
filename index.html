<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Charles Miller · App do Condomínio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2933">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Charles Miller">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#1f2933;
  --navy-900:#27333f;
  --navy-800:#32414f;
  --navy-700:#1c6b61;
  --gold-500:#2a9d8f;
  --gold-400:#4bbdaf;
  --gold-100:#d9f0ec;
  --paper:#f4f6f7;
  --card:#ffffff;
  --ink:#1c1c1c;
  --ink-soft:#5c5f66;
  --line:#e2e6e9;
  --green:#2f8f5b;
  --green-bg:#e7f4ec;
  --red:#c14a3f;
  --red-bg:#fbeae7;
  --amber:#b9822c;
  --amber-bg:#f8ecd8;
  --blue:#3a6ea8;
  --blue-bg:#e9f1fa;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(31,41,51,.04), 0 8px 24px -12px rgba(31,41,51,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;letter-spacing:-.01em;}
.num,.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}

/* ---------- Role switcher shell ---------- */
#roleSwitch{
  position:fixed;top:10px;right:10px;left:10px;z-index:500;
  background:var(--navy-950);border-radius:999px;padding:4px;
  display:flex;gap:2px;box-shadow:var(--shadow);
  max-width:460px;margin:0 auto;overflow-x:auto;
}
#roleSwitch::-webkit-scrollbar{display:none;}
#roleSwitch button{
  border:none;background:transparent;color:#b9c2d6;font-weight:600;font-size:11px;
  padding:8px 10px;border-radius:999px;transition:.2s;white-space:nowrap;flex:1;
}
#roleSwitch button.active{background:var(--gold-500);color:var(--navy-950);}
@media (min-width:900px){
  #roleSwitch{left:auto;right:14px;max-width:none;}
  #roleSwitch button{font-size:12.5px;padding:8px 14px;}
}

/* ---------- Resident app frame ---------- */
#residentApp{max-width:460px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:88px;padding-top:44px;}
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 0;font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}

.topbar{display:flex;align-items:center;gap:12px;padding:18px 20px 6px;}
.topbar .back{width:34px;height:34px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;border:1px solid var(--line);font-size:16px;}
.topbar h1{font-size:19px;margin:0;font-weight:600;}

.view{padding:0 20px 10px;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* --- Home hero --- */
.hero{
  background:linear-gradient(160deg,var(--navy-950),var(--navy-800) 70%);
  border-radius:0 0 28px 28px;padding:52px 20px 26px;color:#fff;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-30px;width:220px;height:220px;
  background:
    radial-gradient(circle at 30% 30%, rgba(199,154,61,.35), transparent 60%);
}
.hero .greet{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:0 0 2px;}
.hero .sub{font-size:13px;color:#b9c2d6;margin:0 0 18px;}
.bell{position:absolute;top:52px;right:20px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:inherit;display:flex;align-items:center;justify-content:center;font-size:16px;}
.bell .dot{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.unit-card{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  border-radius:var(--radius-md);padding:14px 16px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(6px);
}
.unit-badge{width:44px;height:44px;border-radius:12px;background:var(--gold-500);color:var(--navy-950);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:15px;}
.unit-card .t1{font-weight:600;font-size:14.5px;}
.unit-card .t2{font-size:12px;color:#b9c2d6;}

.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px;}
.section-title h2{font-size:15.5px;margin:0;font-weight:700;}
.section-title .see-all{font-size:12.5px;color:var(--navy-700);font-weight:600;background:none;border:none;padding:0;}
button.see-all,.see-all[onclick]{cursor:pointer;}

.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;}
.quick-item{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;}
.quick-item .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:21px;}
.quick-item span{font-size:11px;color:var(--ink-soft);font-weight:600;text-align:center;}

.card{background:var(--card);border-radius:var(--radius-md);border:1px solid var(--line);box-shadow:var(--shadow);}
.list-card{padding:6px 14px;}
.list-row{display:flex;gap:12px;align-items:flex-start;padding:13px 2px;border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
.list-ic{width:40px;height:40px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;}
.list-body{flex:1;min-width:0;}
.list-body .t1{font-size:13.5px;font-weight:600;margin:0 0 2px;}
.list-body .t2{font-size:11.5px;color:var(--ink-soft);margin:0;}
.badge{font-size:10px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;height:fit-content;}
.b-green{background:var(--green-bg);color:var(--green);}
.b-blue{background:var(--blue-bg);color:var(--blue);}
.b-red{background:var(--red-bg);color:var(--red);}
.b-amber{background:var(--amber-bg);color:var(--amber);}
.b-navy{background:var(--navy-900);color:#fff;}

.date-chip{width:44px;text-align:center;flex:none;}
.date-chip .d{font-family:'Fraunces',serif;font-weight:700;font-size:19px;line-height:1;}
.date-chip .m{font-size:9.5px;color:var(--ink-soft);text-transform:uppercase;font-weight:700;}

/* --- tabs --- */
.tabs{display:flex;gap:6px;background:var(--navy-900);padding:4px;border-radius:999px;margin-bottom:16px;}
.tabs button{flex:1;border:none;background:transparent;color:#b9c2d6;font-weight:600;font-size:12.5px;padding:9px 6px;border-radius:999px;}
.tabs button.active{background:var(--gold-500);color:var(--navy-950);}
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
.filters::-webkit-scrollbar{display:none;}
.chip{border:1px solid var(--line);background:var(--card);padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--ink-soft);}
.chip.active{background:var(--navy-950);color:#fff;border-color:var(--navy-950);}

/* --- financeiro --- */
.balance-card{background:linear-gradient(155deg,var(--navy-950),var(--navy-700));border-radius:var(--radius-lg);padding:22px;color:#fff;margin-bottom:18px;}
.balance-card .lbl{font-size:12px;color:#b9c2d6;margin:0 0 6px;}
.balance-card .val{font-family:'Fraunces',serif;font-size:32px;font-weight:600;margin:0 0 16px;}
.pay-all{background:var(--gold-500);color:var(--navy-950);border:none;padding:11px 18px;border-radius:11px;font-weight:700;font-size:13px;}
.bill-card{padding:16px;margin-bottom:12px;}
.bill-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.bill-top .t1{font-weight:700;font-size:14px;margin:0 0 3px;}
.bill-top .t2{font-size:11.5px;color:var(--red);margin:0;font-weight:600;}
.bill-top .val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;}
.bill-actions{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px dashed var(--line);}
.pay-btn{background:var(--navy-950);color:#fff;border:none;padding:9px 16px;border-radius:9px;font-size:12.5px;font-weight:700;}
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;}
.action-card{padding:14px;display:flex;align-items:center;gap:10px;width:100%;text-align:left;}
.action-card .ic{font-size:18px;}
.action-card .t1{font-size:12.5px;font-weight:700;margin:0;}
.action-card .t2{font-size:10.5px;color:var(--ink-soft);margin:0;}
.tip-card{background:var(--gold-100);border:1px solid var(--gold-400);border-radius:var(--radius-md);padding:15px;margin-top:18px;}
.tip-card p{margin:0;font-size:12.5px;color:#15514a;}
.tip-card .t1{font-weight:700;margin-bottom:4px;}

/* --- calendar --- */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.cal-head .nav{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal-grid .dow{font-size:10px;color:var(--ink-soft);font-weight:700;padding-bottom:6px;}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:12.5px;position:relative;color:var(--ink);}
.cal-day.dim{color:#c9c6ba;}
.cal-day.today{border:1.5px solid var(--navy-950);font-weight:700;}
.cal-day.sel{background:var(--navy-950);color:#fff;font-weight:700;}
.cal-day .evt{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:14px;font-size:11px;color:var(--ink-soft);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block;}

.fab.oculto{display:none;}
.fab{position:fixed;bottom:100px;right:max(20px,calc(50% - 230px + 20px));width:52px;height:52px;border-radius:16px;background:var(--navy-950);color:var(--gold-400);border:none;font-size:22px;box-shadow:var(--shadow);z-index:60;display:flex;align-items:center;justify-content:center;}

/* --- bottom nav --- */
.bottomnav{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 4px 12px;z-index:80;}
.bottomnav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:#9a9a94;font-size:10px;font-weight:600;padding:6px 0;}
.bottomnav button.active{color:var(--navy-950);}
.bottomnav .ico{font-size:18px;}
.bottomnav button.central .ico{width:38px;height:38px;background:var(--navy-950);color:var(--gold-400);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:1px;}
.bottomnav button.central.active .ico{background:var(--gold-500);color:var(--navy-950);}

.empty-note{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:12.5px;}

/* =================== ADMIN =================== */
#staffApp{display:none;min-height:100vh;}
#staffApp.show{display:flex;}
.sidebar{width:238px;flex:none;background:var(--navy-950);color:#fff;min-height:100vh;padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sb-brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;}
.sb-brand .mark{width:36px;height:36px;background:var(--gold-500);border-radius:10px;color:var(--navy-950);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;}
.sb-brand .t1{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;line-height:1.1;}
.sb-brand .t2{font-size:10.5px;color:#8ea0c4;}
.sb-user{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;margin-bottom:18px;}
.sb-user img,.sb-user .av{width:34px;height:34px;border-radius:50%;background:var(--gold-400);color:var(--navy-950);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;}
.sb-user .t1{font-size:12.5px;font-weight:700;}
.sb-user .t2{font-size:10px;color:#8ea0c4;}
.sb-nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500;color:#c3cde3;margin-bottom:2px;}
.sb-nav a .ico{width:18px;text-align:center;font-size:14px;}
.sb-nav a.active{background:var(--gold-500);color:var(--navy-950);font-weight:700;}
.sb-nav a:hover:not(.active){background:rgba(255,255,255,.06);}

.admin-main{flex:1;padding:26px 32px 60px;min-width:0;}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.admin-topbar h1{font-size:24px;margin:0;font-weight:600;}
.datechip{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 16px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
.kpi-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow);}
.kpi-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.kpi-card .lbl{font-size:12px;color:var(--ink-soft);font-weight:600;}
.kpi-card .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.kpi-card .val{font-family:'Fraunces',serif;font-size:23px;font-weight:600;margin:0;}
.kpi-card .delta{font-size:11px;font-weight:700;margin-top:4px;}
.delta.up{color:var(--green);}
.delta.down{color:var(--red);}

.admin-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;margin-bottom:20px;align-items:stretch;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow);}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.panel-head h3{margin:0;font-size:14.5px;font-weight:700;}
.panel-head .see-all,td .see-all{font-size:11.5px;color:var(--navy-700);font-weight:600;background:none;border:none;padding:0;font-family:inherit;}
.panel-head select{border:1px solid var(--line);border-radius:8px;font-size:11.5px;padding:5px 9px;font-family:inherit;background:var(--paper);}

.chart-wrap{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:6px;}
.bar-pair{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%;}
.bar{width:9px;border-radius:3px 3px 0 0;}
.bar.rec{background:var(--green);}
.bar.desp{background:var(--red);opacity:.8;}
.chart-labels{display:flex;gap:8px;margin-top:6px;}
.chart-labels span{flex:1;text-align:center;font-size:9.5px;color:var(--ink-soft);}
.chart-legend{display:flex;gap:16px;font-size:11px;color:var(--ink-soft);margin-bottom:2px;}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;}
.chart-legend i{width:7px;height:7px;border-radius:2px;}

.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.donut{width:118px;height:118px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;}
.donut .hole{width:74px;height:74px;background:var(--card);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut .hole .n{font-family:'Fraunces',serif;font-size:22px;font-weight:700;line-height:1;}
.donut .hole .l{font-size:9px;color:var(--ink-soft);}
.donut-legend{width:100%;font-size:11.5px;margin-top:6px;}
.donut-legend .row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;}
.donut-legend .row .k{display:flex;align-items:center;gap:6px;color:var(--ink-soft);}
.donut-legend i{width:8px;height:8px;border-radius:50%;}

.mini-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
.mini-row:last-child{border-bottom:none;}
.mini-row .t1{font-size:12.5px;font-weight:600;margin:0;}
.mini-row .t2{font-size:11px;color:var(--ink-soft);margin:0;}

.bottom-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.progress-track{background:var(--line);border-radius:999px;height:6px;overflow:hidden;margin:6px 0;}
.progress-fill{height:100%;background:var(--navy-950);border-radius:999px;}
.vote-btn{width:100%;background:var(--navy-950);color:#fff;border:none;padding:11px;border-radius:10px;font-weight:700;font-size:12.5px;margin-top:10px;}

.shortcut-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.shortcut{border:1px solid var(--line);border-radius:12px;padding:13px 8px;text-align:center;background:var(--paper);}
.shortcut .ic{font-size:17px;margin-bottom:6px;}
.shortcut span{display:block;font-size:11px;font-weight:700;}

table.datatable{width:100%;border-collapse:collapse;font-size:13px;}
table.datatable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:10px 12px;border-bottom:1px solid var(--line);}
table.datatable td{padding:12px;border-bottom:1px solid var(--line);}
table.datatable tr:last-child td{border-bottom:none;}
.inline-select{border:1px solid var(--line);border-radius:8px;font-size:11.5px;padding:5px 8px;font-family:inherit;background:var(--paper);}

/* --- tela de autenticação --- */
#authShell{position:fixed;inset:0;z-index:2000;background:linear-gradient(160deg,var(--navy-950),var(--navy-800) 70%);
  display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;}
.auth-card{background:var(--card);border-radius:var(--radius-lg);padding:30px 26px;width:100%;max-width:380px;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.5);}
.auth-marca{width:52px;height:52px;border-radius:15px;background:var(--gold-500);color:var(--navy-950);
  display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;
  font-size:18px;margin-bottom:16px;}
.auth-card h1{font-size:22px;margin:0 0 2px;}
.auth-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 22px;}
.auth-card label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px;}
.auth-card input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  font-family:inherit;font-size:14px;background:var(--paper);}
.auth-card input:focus{outline:none;border-color:var(--navy-700);}
.auth-btn{width:100%;background:var(--navy-950);color:#fff;border:none;padding:13px;border-radius:11px;
  font-weight:700;font-size:14px;margin-top:20px;}
.auth-link{width:100%;background:none;border:none;color:var(--navy-700);font-weight:600;font-size:12.5px;
  padding:12px 0 0;}
.auth-erro{background:var(--red-bg);color:var(--red);border-radius:10px;padding:11px 13px;font-size:12.5px;
  font-weight:600;margin-bottom:4px;}
.auth-nota{font-size:11px;color:var(--ink-soft);line-height:1.5;margin:14px 0 0;}
.auth-aguardando{text-align:center;padding:6px 0;}
.auth-aguardando .ic{font-size:34px;margin-bottom:10px;}
.auth-aguardando h2{font-family:'Fraunces',serif;font-size:17px;margin:0 0 10px;}
.auth-aguardando p{font-size:13px;color:var(--ink-soft);line-height:1.55;margin:0 0 8px;}

/* --- cabeçalho da conta (substituiu o seletor de perfil) --- */
#roleSwitch{align-items:center;gap:10px;padding:7px 8px 7px 16px;}
#roleSwitch .conta-nome{color:#fff;font-weight:700;font-size:12.5px;white-space:nowrap;

function descreveUnidade(cod){
  if(!cod) return "—";
  const [num,torre] = String(cod).split("-");
  return torre ? `Apto ${num} - Torre ${torre}` : `Apto ${num}`;
}

/* mês exibido no calendário — os eventos mock pertencem a agosto/2026 */
const MES_EVENTOS={ano:2026,mes:7};
let calAno=MES_EVENTOS.ano, calMes=MES_EVENTOS.mes;
const nomesMes=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function calNav(delta){
  calMes+=delta;
  if(calMes>11){calMes=0;calAno++;}
  if(calMes<0){calMes=11;calAno--;}
  // preserva a aba aberta ao re-renderizar a tela de reservas
  const abas=[...document.querySelectorAll("#residentViews .tabs button")];
  const ativa=abas.findIndex(b=>b.classList.contains("active"));
  goView("reservas");
  if(ativa>0){
    const novas=document.querySelectorAll("#residentViews .tabs button");
    if(novas[ativa]) novas[ativa].click();
  }
}

function calendar(){
  const dow=["D","S","T","Q","Q","S","S"];
  const primeiroDiaSemana=new Date(calAno,calMes,1).getDay();      // 0=domingo
  const diasNoMes=new Date(calAno,calMes+1,0).getDate();
  const diasMesAnterior=new Date(calAno,calMes,0).getDate();
  const hoje=new Date();
  const mostraEventos = calAno===MES_EVENTOS.ano && calMes===MES_EVENTOS.mes;
  let cells="";
  // cauda do mês anterior, para alinhar o dia 1 na coluna correta
  for(let i=primeiroDiaSemana;i>0;i--){
    cells+=`<div class="cal-day dim">${diasMesAnterior-i+1}</div>`;
  }
  for(let d=1;d<=diasNoMes;d++){
    const ehHoje = d===hoje.getDate() && calMes===hoje.getMonth() && calAno===hoje.getFullYear();
    let cls="cal-day"+(ehHoje?" today":"");
    let dot="";
    if(mostraEventos && calendarEvents[d]){
      const map={reserva:"#3a6ea8",evento:"#6d4fa8",manutencao:"#b9822c",assembleia:"#27333f"};
      dot=`<span class="evt" style="background:${map[calendarEvents[d]]}"></span>`;
    }
    cells+=`<div class="${cls}">${d}${dot}</div>`;
  }
  // completa a última semana com o início do mês seguinte
  const resto=(7-((primeiroDiaSemana+diasNoMes)%7))%7;
  for(let d=1;d<=resto;d++) cells+=`<div class="cal-day dim">${d}</div>`;
  return `
  <div class="card" style="padding:16px">
    <div class="cal-head">
      <button class="nav" onclick="calNav(-1)">‹</button>
      <strong style="font-size:13.5px">${nomesMes[calMes]} ${calAno}</strong>
      <button class="nav" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-grid">
      ${dow.map(d=>`<div class="dow">${d}</div>`).join("")}
      ${cells}
    </div>
    <div class="legend">
      <span><i style="background:#3a6ea8"></i>Reservas</span>
      <span><i style="background:#6d4fa8"></i>Eventos</span>
      <span><i style="background:#b9822c"></i>Manutenções</span>
      <span><i style="background:#27333f"></i>Assembleias</span>
    </div>
  </div>`;
}

function toggleReservaMorador(mostrar){
  const p=document.getElementById("reservaMoradorPanel");
  if(!p) return;
  p.style.display = mostrar ? "block":"none";
  ocultarFab(mostrar);
  if(mostrar){ mostrarRegraArea(); document.getElementById("rmArea").onchange = mostrarRegraArea; }
}
function mostrarRegraArea(){
  const sel=document.getElementById("rmArea"), txt=document.getElementById("rmRegra");
  if(!sel||!txt) return;
  const a=config.areas.find(x=>x.nome===sel.value);
  txt.textContent = a
    ? `Até ${a.cap} pessoas · reserve com ${a.antec} dias de antecedência${a.taxa?` · taxa de ${fmtBRL(a.taxa)}`:" · sem taxa"}`
    : "";
}
async function addReservaMorador(){
  const area=document.getElementById("rmArea").value;
  const data=document.getElementById("rmData").value;
  const hora=document.getElementById("rmHora").value.trim();
  if(!area){ toast("Nenhuma área está liberada para reserva"); return; }
  if(!data){ toast("Escolha a data"); return; }
  const cfg=config.areas.find(a=>a.nome===area);
  const dias=diasAte(data);
  if(dias<0){ toast("A data não pode estar no passado"); return; }
  if(cfg && dias<cfg.antec){ toast(`${area} exige ${cfg.antec} dias de antecedência`); return; }
  if(reservas.some(r=>r.titulo===area && r.data.startsWith(fmtData(data)) && r.tag!=="Cancelada")){
    toast(`${area} já está reservada em ${fmtData(data)}`); return;
  }
  const [ic,cor]=iconeArea(area);
  // nasce Pendente: quem confirma é a portaria ou o síndico
  const nova={ic,cor,titulo:area,morador:morador.cod,
    data:`${fmtData(data)} · ${hora||'a definir'}`,
    num:"Reserva #"+(1200+reservas.length+1),tag:"Pendente",tagClass:"b-amber"};
  await dbInserir("reservas",nova);
  reservas.unshift(nova);
  goView("reservas");
  toast("Reserva solicitada — aguarde a confirmação");
}

async function votar(idAss,idPauta,voto){
  const a=assembleias.find(x=>x.id===idAss);
  if(!a || a.status!=="Votação aberta"){ toast("Esta votação não está aberta"); return; }
  const p=a.pauta.find(x=>x.id===idPauta);
  if(!p) return;
  if(!morador.cod){ toast("Sua conta não está vinculada a uma unidade"); return; }
  if(p.meuVoto===voto){ toast("Você já votou assim nesta pauta"); return; }

  // um voto por unidade: o upsert troca o voto anterior em vez de somar outro
  if(ONLINE){
    const { error } = await sb.from("cm_votos")
      .upsert({ assembleia_id:idAss, pauta_id:idPauta, unidade:morador.cod, voto,
                atualizado_em:new Date().toISOString() },
              { onConflict:"pauta_id,unidade" });
    if(error){ avisarFalhaDB("registrar voto", error); return; }
    const r = await sb.from("cm_votos").select("*");
    if(!r.error) votos = (r.data||[]).map(paraJS);
  } else {
    const j = votos.findIndex(v=>v.pautaId===idPauta && v.unidade===morador.cod);
    if(j>=0) votos[j].voto=voto;
    else votos.push({assembleiaId:idAss,pautaId:idPauta,unidade:morador.cod,voto});
  }
  aplicarVotos();
  const abaAtiva=[...document.querySelectorAll("#residentViews .tabs button")].findIndex(b=>b.classList.contains("active"));
  goView("assembleias");
  if(abaAtiva>0){
    const abas=document.querySelectorAll("#residentViews .tabs button");
    if(abas[abaAtiva]) abas[abaAtiva].click();
  }
  toast(`Voto registrado: ${{sim:'Sim',nao:'Não',abst:'Abstenção'}[voto]}`);
}

async function addReserva(){
  const area=document.getElementById("rfArea").value;
  const unidade=document.getElementById("rfMorador").value.trim().toUpperCase();
  const data=document.getElementById("rfData").value;
  const hora=document.getElementById("rfHora").value.trim();
  if(!unidade||!data){ toast("Preencha unidade e data"); return; }
  if(!area){ toast("Nenhuma área comum está liberada para reserva"); return; }
  const cfg=config.areas.find(a=>a.nome===area);
  const antecedencia=diasAte(data);
  if(antecedencia<0){ toast("A data não pode estar no passado"); return; }
  if(cfg && antecedencia<cfg.antec){
    toast(`${area} exige ${cfg.antec} dias de antecedência`); return;
  }
  if(reservas.some(r=>r.titulo===area && r.data.startsWith(fmtData(data)) && r.tag!=="Cancelada")){
    toast(`${area} já está reservada em ${fmtData(data)}`); return;
  }
  const [ic,cor]=iconeArea(area);
  const nova={ic,cor,titulo:area,morador:unidade,
    data:`${fmtData(data)} · ${hora||'a definir'}`,
    num:"Reserva #"+(1200+reservas.length+1),tag:"Confirmada",tagClass:"b-green"};
  await dbInserir("reservas",nova);
  reservas.unshift(nova);
  goAdmin("reservas");
  toast("Reserva criada");
}

/* ============================================================
   HELPERS DE FORMATAÇÃO E DATA
   ============================================================ */
function fmtBRL(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function fmtData(iso){const [a,m,d]=iso.split('-');return `${d}/${m}/${a}`;}
function hojeISO(){const d=new Date();return d.toISOString().slice(0,10);}
function diasAte(iso){
  const alvo=new Date(iso+"T00:00:00"), hoje=new Date(); hoje.setHours(0,0,0,0);
  return Math.round((alvo-hoje)/86400000);
}
function somaISO(iso,meses){
  const d=new Date(iso+"T00:00:00");
  d.setMonth(d.getMonth()+meses);
  return d.toISOString().slice(0,10);
}

/* ============================================================
   MÓDULO: FALE COM O SÍNDICO
   ============================================================ */
let conversaAberta = null;   // id da thread aberta (morador e síndico)
let filtroConversa = "Todas";

/* status vem de quem mandou a última mensagem — nunca é gravado */
function statusConversa(c){
  if(c.encerrada) return {txt:"Encerrada",cls:"b-navy",aguardando:false};
  const ultima=c.mensagens[c.mensagens.length-1];
  return ultima.de==="sindico"
    ? {txt:"Respondida",cls:"b-green",aguardando:false}
    : {txt:"Aguardando resposta",cls:"b-amber",aguardando:true};
}
function ultimaMensagem(c){return c.mensagens[c.mensagens.length-1];}
function conversasDaUnidade(u){return conversas.filter(c=>c.unidade===u);}
function naoLidas(c,paraQuem){
  const outro = paraQuem==="morador" ? "sindico" : "morador";
  return c.mensagens.filter(m=>m.de===outro && !m.lida).length;
}
function totalNaoLidasMorador(){
  return conversasDaUnidade(morador.cod).reduce((s,c)=>s+naoLidas(c,"morador"),0);
}
function marcarLidas(c,paraQuem){
  const outro = paraQuem==="morador" ? "sindico" : "morador";
  const tinhaNaoLida = c.mensagens.some(m=>m.de===outro && !m.lida);
  c.mensagens.forEach(m=>{ if(m.de===outro) m.lida=true; });
  if(tinhaNaoLida) dbAtualizar("conversas",c);   // em segundo plano: não bloqueia o render
}
/* ordena: aguardando resposta primeiro, depois pela mensagem mais recente */
function conversasOrdenadas(lista){
  return [...lista].sort((a,b)=>{
    const pa=statusConversa(a).aguardando?1:0, pb=statusConversa(b).aguardando?1:0;
    if(pa!==pb) return pb-pa;
    const ma=ultimaMensagem(a), mb=ultimaMensagem(b);
    return (mb.data+mb.hora).localeCompare(ma.data+ma.hora);
  });
}
function bolhas(c){
  return c.mensagens.map(m=>`
    <div class="msg ${m.de}">

async function responderConversa(id,de){

/* a autorização vale na data informada? */
function autorizadaEm(a,iso){
  if(a.cancelada) return false;
  if(a.tipo==="unica") return a.data===iso;
  if(iso<a.de || iso>a.ate) return false;
  if(a.tipo==="periodo") return true;
  // recorrente: precisa cair num dos dias da semana escolhidos
  return a.dias.includes(new Date(iso+"T00:00:00").getDay());
}
function ultimaDataAutorizacao(a){ return a.tipo==="unica" ? a.data : a.ate; }

function statusAutorizacao(a){
  const hoje=hojeISO();
  if(a.cancelada) return {txt:"Cancelada",cls:"b-navy",ativa:false};
  if(a.tipo==="unica" && a.usos.length) return {txt:"Utilizada",cls:"b-green",ativa:false};
  if(ultimaDataAutorizacao(a)<hoje) return {txt:"Expirada",cls:"b-red",ativa:false};
  if(autorizadaEm(a,hoje)) return {txt:"Válida hoje",cls:"b-green",ativa:true};
  return {txt:"Agendada",cls:"b-blue",ativa:false};
}

function descreveValidade(a){
  if(a.tipo==="unica") return "Somente em "+fmtData(a.data);
  if(a.tipo==="periodo") return `De ${fmtData(a.de)} a ${fmtData(a.ate)}`;
  const d=[...a.dias].sort().map(i=>diasSemana[i]).join(", ");
  return `${d} · até ${fmtData(a.ate)}`;
}

function autorizacoesDaUnidade(u){return autorizacoes.filter(a=>a.unidade===u);}
function autorizadasHoje(){return autorizacoes.filter(a=>autorizadaEm(a,hojeISO()));}

function novoCodigoAutorizacao(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sem I,O,0,1 para não confundir na portaria
  let cod;
  do{
    cod="CM-"+Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join("");
  } while(autorizacoes.some(a=>a.codigo===cod));
  return cod;
}

async function addAutorizacao(){
  const nome=document.getElementById("atNome").value.trim();
  const doc=document.getElementById("atDoc").value.trim()||"—";
  const motivo=document.getElementById("atMotivo").value;
  const tipo=document.getElementById("atTipo").value;
  if(!nome){ toast("Informe o nome do visitante"); return; }

  const hoje=hojeISO();
  const nova={id:Math.max(0,...autorizacoes.map(a=>a.id))+1,
    unidade:morador.cod,nome,doc,motivo,tipo,codigo:novoCodigoAutorizacao(),cancelada:false,usos:[]};

  if(tipo==="unica"){
    const data=document.getElementById("atData").value;
    if(!data){ toast("Escolha a data da visita"); return; }
    if(data<hoje){ toast("A data não pode estar no passado"); return; }
    nova.data=data;
  } else {
    const de=document.getElementById("atDe").value, ate=document.getElementById("atAte").value;
    if(!de||!ate){ toast("Informe o período de validade"); return; }
    if(ate<de){ toast("A data final não pode ser anterior à inicial"); return; }

  if(!a) return;
  const msg=`${a.nome}, sua entrada no Condomínio Charles Miller está autorizada. Código na portaria: ${a.codigo} (${descreveValidade(a)}).`;
  if(navigator.share){ navigator.share({text:msg}).catch(()=>{}); return; }
  if(navigator.clipboard){ navigator.clipboard.writeText(msg).then(()=>toast("Mensagem copiada")).catch(()=>toast(a.codigo)); return; }

/* aceita Mercosul (ABC1D23) e o padrão antigo (ABC1234) */
function normalizaPlaca(p){return p.toUpperCase().replace(/[^A-Z0-9]/g,"");}
function placaValida(p){
  const n=normalizaPlaca(p);
  return /^[A-Z]{3}\d[A-Z]\d{2}$/.test(n) || /^[A-Z]{3}\d{4}$/.test(n);
}
function formataPlaca(p){
  const n=normalizaPlaca(p);
  return /^[A-Z]{3}\d{4}$/.test(n) ? n.slice(0,3)+"-"+n.slice(3) : n;
}

async function salvarConta(id, campos, aviso){
  const { error } = await sb.from("cm_usuarios").update(campos).eq("id", id);
  if(error){ avisarFalhaDB("atualizar conta", error); return false; }
  await carregarContas();
  goAdmin("contas");
  if(aviso) toast(aviso);
  return true;
}
async function alternarConta(id){
  const c = contas.find(x=>x.id===id);
  if(!c) return;
  if(!c.ativo && c.papel==="morador" && !c.unidade){
    toast("Informe a unidade antes de liberar"); return;
  }
  await salvarConta(id, { ativo: !c.ativo }, c.ativo ? "Acesso suspenso" : `${c.nome} liberado`);
}
async function mudarPapel(id, papel){
  await salvarConta(id, { papel }, "Papel atualizado");
}
async function mudarUnidade(id, valor){
  const u = (valor||"").trim().toUpperCase() || null;
  if(u && !todasUnidades().includes(u)){ toast("Unidade inexistente — use o formato 802-A"); goAdmin("contas"); return; }
  await salvarConta(id, { unidade: u }, "Unidade atualizada");
}
async function removerConta(id){
  const c = contas.find(x=>x.id===id);
  if(!c) return;
  if(!confirm(`Remover o acesso de ${c.nome} (${c.email})?\n\nA conta deixa de enxergar qualquer dado do condomínio.`)) return;
  const { error } = await sb.from("cm_usuarios").delete().eq("id", id);
  if(error){ avisarFalhaDB("remover conta", error); return; }
  await carregarContas();
  goAdmin("contas");
  toast("Acesso removido");
}

function filtrarAvisos(c){ filtroAviso=c; goAdmin("avisos"); }

function novoAviso(){
  avisoEditando=null;
  const p=document.getElementById("avisoFormPanel");
  if(p){ p.style.display="block"; limparFormAviso(); document.getElementById("avTitulo").focus(); }
}
function limparFormAviso(){
  document.getElementById("avTitulo").value="";
  document.getElementById("avCorpo").value="";
  document.getElementById("avCat").value="comunicados";
  const s=document.getElementById("avFixado");
  s.classList.remove("on"); s.setAttribute("aria-checked","false");
}
function alternarFixarNoForm(){
  const s=document.getElementById("avFixado");
  const on=!s.classList.contains("on");
  s.classList.toggle("on",on);
  s.setAttribute("aria-checked",String(on));
}
function editarAviso(i){
  avisoEditando=i;
  goAdmin("avisos");
  const a=avisos[i];
  document.getElementById("avTitulo").value=a.titulo;
  document.getElementById("avCorpo").value=a.corpo;
  document.getElementById("avCat").value=a.cat;
  document.getElementById("avisoFormPanel").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function cancelarAviso(){
  avisoEditando=null;
  goAdmin("avisos");
}
async function salvarAviso(){
  const titulo=document.getElementById("avTitulo").value.trim();
  const corpo=document.getElementById("avCorpo").value.trim();
  const cat=document.getElementById("avCat").value;
  const fixado=document.getElementById("avFixado").classList.contains("on");
  if(!titulo){ toast("Informe o título do aviso"); return; }
  if(!corpo){ toast("Escreva a mensagem do aviso"); return; }

  const notif=config.notificacoes.find(n=>n.chave==="avisos");
  if(avisoEditando!==null){
    Object.assign(avisos[avisoEditando],{titulo,corpo,cat,fixado});
    await dbAtualizar("avisos",avisos[avisoEditando]);
    avisoEditando=null;
    goAdmin("avisos");
    toast("Aviso atualizado");
  } else {
    const agora=new Date();
    const novo={titulo,corpo,cat,fixado,
      data:`${agora.toLocaleDateString('pt-BR')} - ${horaAgora()}`};
    await dbInserir("avisos",novo);
    avisos.unshift(novo);
    filtroAviso="Todos";
    goAdmin("avisos");
    toast(notif.ativo
      ? `Aviso publicado · ${TOTAL_UNIDADES} unidades notificadas`
      : "Aviso publicado (notificações desativadas)");
  }
}
async function alternarFixado(i){
  const a=avisos[i];
  if(!a) return;
  a.fixado=!a.fixado;
  await dbAtualizar("avisos",a);
  goAdmin("avisos");
  toast(a.fixado?"Aviso fixado no topo":"Aviso desafixado");
}
async function removerAviso(i){
  const a=avisos[i];
  if(!a) return;
  if(!confirm(`Remover o aviso "${a.titulo}"? Ele deixará de aparecer para os moradores.`)) return;
  await dbRemover("avisos",a.id);
  avisos.splice(i,1);
  avisoEditando=null;   // os índices mudaram: cancela qualquer edição em curso
  goAdmin("avisos");
  toast("Aviso removido");
}

let assembleiaAberta = null;   // id da assembleia expandida

function statusAssembleia(a){
  return {"Votação aberta":"b-green","Agendada":"b-blue","Encerrada":"b-navy"}[a.status]||"b-amber";
}
let votos = [];   // cm_votos: {id,assembleiaId,pautaId,unidade,voto}

/* Projeta cm_votos nos campos que as telas já leem. Mantém os
   renderizadores intactos e deixa o banco como fonte única —
   antes os contadores viviam no jsonb e dois votos simultâneos
   se sobrescreviam. */
function aplicarVotos(){
  const porPauta = {};
  votos.forEach(v=>{
    const p = porPauta[v.pautaId] || (porPauta[v.pautaId] = {sim:0,nao:0,abst:0,meuVoto:null});
    if(p[v.voto]!==undefined) p[v.voto]++;
    if(v.unidade === morador.cod) p.meuVoto = v.voto;
  });
  assembleias.forEach(a=>(a.pauta||[]).forEach(item=>{
    const c = porPauta[item.id] || {sim:0,nao:0,abst:0,meuVoto:null};
    item.sim=c.sim; item.nao=c.nao; item.abst=c.abst; item.meuVoto=c.meuVoto;
  }));
}
function totalVotos(item){return item.sim+item.nao+item.abst;}
function votosAssembleia(a){
  // participação = maior nº de votos entre as pautas
  return a.pauta.reduce((max,p)=>Math.max(max,totalVotos(p)),0);
}

function cardAssembleia(a){
  const votos=votosAssembleia(a);
  const pct=Math.round(votos/TOTAL_UNIDADES*100);
  const quorumOk=votos>TOTAL_UNIDADES/2;
  const expandida=assembleiaAberta===a.id;
  return `
  <div class="ass-card">
    <div class="ass-head" onclick="toggleAssembleia(${a.id})">
      <div class="list-ic" style="background:var(--gold-100)">🗳️</div>
      <div style="flex:1;min-width:0">
        <p class="t1">${a.titulo}</p>
        <p class="t2">${fmtData(a.data)} às ${a.hora} · ${a.local} · ${a.pauta.length} ${a.pauta.length===1?'item de pauta':'itens de pauta'}</p>
      </div>
      <span class="badge ${statusAssembleia(a)}">${a.status}</span>
      <span class="chevron">${expandida?'▾':'▸'}</span>
    </div>
    <p class="quorum-lbl">Participação · ${pct}% (${votos} de ${TOTAL_UNIDADES})
      <strong style="color:${quorumOk?'var(--green)':'var(--amber)'}">${quorumOk?'quórum atingido':'sem quórum'}</strong></p>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${quorumOk?'var(--green)':'var(--amber)'}"></div></div>
    ${expandida?`<div class="ass-body">
      ${a.pauta.map(p=>pautaAdmin(a,p)).join("")}
      <div class="form-actions" style="margin-top:14px">
        ${a.status==="Agendada"?`<button class="btn-primary" onclick="mudarStatusAssembleia(${a.id},'Votação aberta')">Abrir votação</button>`:''}
        ${a.status==="Votação aberta"?`<button class="btn-primary" onclick="mudarStatusAssembleia(${a.id},'Encerrada')">Encerrar votação</button>`:''}
        ${a.status==="Encerrada"?`<button class="btn-ghost" onclick="toast('Ata gerada (protótipo)')">Gerar ata</button>`:''}
      </div>
    </div>`:''}
  </div>`;
}

function pautaAdmin(a,p){
  const t=totalVotos(p);
  const barra=(n,cor)=>`<div style="width:${t?n/t*100:0}%;background:${cor}"></div>`;
  const resultado = t===0 ? "Sem votos" : (p.sim>p.nao?"Aprovada":(p.nao>p.sim?"Rejeitada":"Empate"));
  const resCls = t===0?"b-blue":(p.sim>p.nao?"b-green":(p.nao>p.sim?"b-red":"b-amber"));
  return `
  <div class="pauta">
    <div class="pauta-top">
      <div style="flex:1;min-width:0"><p class="t1">${p.titulo}</p><p class="t2">${p.desc}</p></div>
      <span class="badge ${resCls}">${resultado}</span>
    </div>
    <div class="voto-bar">${barra(p.sim,'var(--green)')}${barra(p.nao,'var(--red)')}${barra(p.abst,'var(--line)')}</div>
    <div class="voto-legend">
      <span><i style="background:var(--green)"></i>Sim ${p.sim}</span>
      <span><i style="background:var(--red)"></i>Não ${p.nao}</span>
      <span><i style="background:var(--line)"></i>Abstenções ${p.abst}</span>
      <span style="margin-left:auto">${t} ${t===1?'voto':'votos'}</span>
    </div>
  </div>`;
}

  goAdmin("assembleias");

function toggleAssForm(show){

async function addAssembleia(){
  const titulo=document.getElementById("afTitulo").value.trim();
  const local=document.getElementById("afLocal").value.trim()||"Salão de Festas";
  const data=document.getElementById("afData").value;
  const hora=document.getElementById("afHora").value||"19:00";
  const pauta=document.getElementById("afPauta").value.trim();
  if(!titulo||!data){ toast("Preencha título e data"); return; }
  const nova={titulo,data,hora,local,status:"Agendada",pauta:[]};
  await dbInserir("assembleias",nova);
  if(pauta){
    nova.pauta=[{id:nova.id*10+1,titulo:pauta,desc:"Item incluído na convocação."}];
    await dbAtualizar("assembleias",nova);
  }
  assembleias.unshift(nova);
  assembleiaAberta=nova.id;
  goAdmin("assembleias");
  toast("Assembleia convocada");

async function mudarStatusAssembleia(id,novo){
  const a=assembleias.find(x=>x.id===id);
  if(!a) return;
  a.status=novo;
  await dbAtualizar("assembleias",a);
  goAdmin("assembleias");
  toast(novo==="Votação aberta"?"Votação aberta aos moradores":"Votação encerrada");

async function addDocumento(){
  const nome=document.getElementById("dfNome").value.trim();
  const cat=document.getElementById("dfCat").value;
  const tipo=document.getElementById("dfTipo").value;
  const arq=document.getElementById("dfArquivo").files[0];
  if(!nome){ toast("Informe o nome do documento"); return; }
  const tam=arq?(arq.size>1048576?(arq.size/1048576).toFixed(1).replace('.',',')+" MB":Math.round(arq.size/1024)+" KB"):"—";
  const novo={nome,cat,tipo,tam,data:new Date().toLocaleDateString('pt-BR')};
  await dbInserir("documentos",novo);
  documentos.unshift(novo);
  filtroDocumento="Todos";
  goAdmin("documentos");
  toast("Documento publicado");

function baixarDocumento(i){
  const d=documentos[i];
  if(d) toast(`Baixando "${d.nome}" (protótipo)`);

async function removerDocumento(i){
  const d=documentos[i];
  if(!d) return;
  if(!confirm(`Remover "${d.nome}" da biblioteca?`)) return;
  await dbRemover("documentos",d.id);
  documentos.splice(i,1);
  goAdmin("documentos");
  toast("Documento removido");
}

function statusManutencao(m){
  const d=diasAte(m.prox);
  if(d<0)  return {txt:"Atrasada",cls:"b-red",dias:d};
  if(d<=15)return {txt:"Vence em "+d+"d",cls:"b-amber",dias:d};
  return {txt:"Em dia",cls:"b-green",dias:d};
}

function renderAdminManutencoes(){
  const ordenadas=[...manutencoes].sort((a,b)=>a.prox.localeCompare(b.prox));
  const atrasadas=manutencoes.filter(m=>statusManutencao(m).dias<0).length;
  const proximas=manutencoes.filter(m=>{const d=statusManutencao(m).dias;return d>=0&&d<=15;}).length;
  const custoAnual=manutencoes.reduce((s,m)=>s+m.custo*(12/periodicidades[m.period]),0);
  return `
  ${adminTopbar("Manutenções")}
  <div class="kpi-grid">
    ${kpi("Atrasadas",String(atrasadas),atrasadas?"exigem ação imediata":"nenhuma pendência","down","⏰","var(--red-bg)")}

   PERSISTÊNCIA — Supabase
   Os arrays globais continuam sendo a fonte da UI; o banco é
   carregado no boot e atualizado a cada mutação. Se o banco
   estiver fora do ar, o app segue funcionando em memória
   (modo demonstração) e avisa na tela.

const SUPA_URL = "https://ohuaoncwgioawgptyqgz.supabase.co";
const SUPA_KEY = "sb_publishable_zyC-vusc-CgM4pzf_Q3gYA_N7i2GT4P";

let sb = null;
let ONLINE = false;

/* coleção em memória → tabela no banco */
const TABELAS = {
  moradoresLista:"cm_moradores", reservas:"cm_reservas", boletos:"cm_boletos",
  boletosDoMes:"cm_boletos_mes", avisos:"cm_avisos", ocorrencias:"cm_ocorrencias",
  encomendas:"cm_encomendas", sugestoes:"cm_sugestoes", visitantes:"cm_visitantes",
  autorizacoes:"cm_autorizacoes", veiculos:"cm_veiculos", assembleias:"cm_assembleias",
  documentos:"cm_documentos", manutencoes:"cm_manutencoes", conversas:"cm_conversas"
};
/* colunas que o banco tem mas a UI não usa — não devolver no update */
const COLS_INTERNAS = ["id","criado_em","atualizado_em","dia"];

const paraSnake = k => k.replace(/[A-Z]/g, c => "_"+c.toLowerCase());
const paraCamel = k => k.replace(/_([a-z])/g, (_,c) => c.toUpperCase());

/* converte só o primeiro nível: o conteúdo de jsonb (pauta, mensagens,
   usos, notificacoes) precisa chegar ao banco exatamente como está */
function paraJS(row){
  const o={};
  for(const k in row) o[paraCamel(k)] = row[k];
  return o;
}
function paraDB(obj){
  const o={};
  for(const k in obj){
    if(k.startsWith("_")) continue;
    o[paraSnake(k)] = obj[k];
  }
  return o;
}

function avisarFalhaDB(acao, erro){
  console.error("[db] "+acao, erro);
  toast("Não foi possível salvar no servidor — alteração só nesta sessão");
}

async function dbInserir(colecao, obj){
  if(!ONLINE) return obj;
  const payload = paraDB(obj);
  delete payload.id;                       // o banco gera
  const { data, error } = await sb.from(TABELAS[colecao]).insert(payload).select().single();
  if(error){ avisarFalhaDB("inserir "+colecao, error); return obj; }
  Object.assign(obj, paraJS(data));        // traz o id gerado
  return obj;
}

async function dbAtualizar(colecao, obj){
  if(!ONLINE || !obj || obj.id==null) return;
  const payload = paraDB(obj);
  COLS_INTERNAS.forEach(c => delete payload[c]);
  const { error } = await sb.from(TABELAS[colecao]).update(payload).eq("id", obj.id);
  if(error) avisarFalhaDB("atualizar "+colecao, error);
}

async function dbRemover(colecao, id){
  if(!ONLINE || id==null) return;
  const { error } = await sb.from(TABELAS[colecao]).delete().eq("id", id);
  if(error) avisarFalhaDB("remover "+colecao, error);
}

async function dbSalvarConfig(chave){
  if(!ONLINE) return;
  const { error } = await sb.from("cm_config")
    .upsert({ chave, valor: config[chave], atualizado_em: new Date().toISOString() },
            { onConflict: "chave" });
  if(error) avisarFalhaDB("salvar config."+chave, error);
}

async function dbSalvarPerfil(){
  if(!ONLINE) return;
  const { error } = await sb.from("cm_perfil").upsert({
    cod: morador.cod, nome: morador.nome, nome_completo: morador.nomeCompleto,
    unidade: morador.unidade, papel: morador.papel, email: morador.email,
    telefone: morador.telefone, notificacoes: morador.notificacoes,
    mostrar_na_lista: morador.mostrarNaLista
  }, { onConflict: "cod" });
  if(error) avisarFalhaDB("salvar perfil", error);
}

/* ---------- carga inicial ---------- */
async function carregarTudo(){
  // a unidade deixa de ser fixa no código: vem da conta autenticada
  if(USUARIO && USUARIO.unidade){
    morador.cod = USUARIO.unidade;
    morador.nomeCompleto = USUARIO.nome;
    morador.nome = USUARIO.nome.split(" ")[0];
    // descrição e vínculo derivam da conta; antes ficavam fixos no código
    morador.unidade = descreveUnidade(USUARIO.unidade);
    morador.papel = "Morador";
  }
  const nomes = Object.keys(TABELAS);
  const respostas = await Promise.all(
    nomes.map(n => sb.from(TABELAS[n]).select("*").order("id", { ascending:true }))
  );
  const destino = {
    moradoresLista:v=>moradoresLista=v, reservas:v=>reservas=v, boletos:v=>boletos=v,
    boletosDoMes:v=>boletosDoMes=v, avisos:v=>avisos=v, ocorrencias:v=>ocorrencias=v,
    encomendas:v=>encomendas=v, sugestoes:v=>sugestoes=v, visitantes:v=>visitantes=v,
    autorizacoes:v=>autorizacoes=v, veiculos:v=>veiculos=v, assembleias:v=>assembleias=v,
    documentos:v=>documentos=v, manutencoes:v=>manutencoes=v, conversas:v=>conversas=v
  };
  respostas.forEach((r,i)=>{
    const nome=nomes[i];
    if(r.error) throw new Error(nome+": "+r.error.message);
    destino[nome]((r.data||[]).map(paraJS));
  });

  /* numéricos chegam como string em colunas numeric */
  boletos.forEach(b => b.val = Number(b.val));
  boletosDoMes.forEach(b => b.val = Number(b.val));
  manutencoes.forEach(m => m.custo = Number(m.custo));

  // votos: uma linha por unidade, agregados na memória para a UI
  const vts = await sb.from("cm_votos").select("*");
  if(vts.error) throw new Error("votos: "+vts.error.message);
  votos = (vts.data||[]).map(paraJS);
  aplicarVotos();

  const cfg = await sb.from("cm_config").select("*");
  if(cfg.error) throw new Error("config: "+cfg.error.message);
  (cfg.data||[]).forEach(r => { config[r.chave] = r.valor; });

  // o vínculo (Proprietário / Locatária …) está no cadastro de moradores
  if(USUARIO && USUARIO.unidade){
    const reg = moradoresLista.find(m=>m.unidade===USUARIO.unidade);
    if(reg && reg.papel) morador.papel = reg.papel.split(" · ")[0];
  }

  if(papelAtual()==="sindico") await carregarContas();

  const perf = await sb.from("cm_perfil").select("*").eq("cod", morador.cod).maybeSingle();
  if(perf.error) throw new Error("perfil: "+perf.error.message);
  if(perf.data){
    const p = perf.data;
    Object.assign(morador, {
      nome:p.nome, nomeCompleto:p.nome_completo, unidade:p.unidade, papel:p.papel,
      email:p.email, telefone:p.telefone, notificacoes:p.notificacoes,
      mostrarNaLista:p.mostrar_na_lista
    });
  }
}

function faixaStatus(texto, cor){
  let el = document.getElementById("statusDB");
  if(!el){
    el = document.createElement("div");
    el.id = "statusDB";
    document.body.appendChild(el);
  }
  el.className = cor;
  el.innerHTML = texto;
}

/* ============================================================
   AUTENTICAÇÃO — Supabase Auth
   O papel e a unidade vêm da conta (cm_usuarios), não mais de um
   seletor na tela. A RLS do banco aplica as mesmas regras do lado
   do servidor: o morador só enxerga a própria unidade.
   ============================================================ */
let USUARIO = null;     // {id,email,nome,papel,unidade,ativo}

function papelAtual(){ return USUARIO ? USUARIO.papel : null; }
function ehStaff(){ return ["porteiro","administrativo","sindico"].includes(papelAtual()); }

function telaAuth(conteudo){
  document.getElementById("roleSwitch").style.display = "none";
  document.getElementById("residentApp").style.display = "none";
  document.getElementById("staffApp").classList.remove("show");
  let el = document.getElementById("authShell");
  if(!el){
    el = document.createElement("div");
    el.id = "authShell";
    document.body.appendChild(el);
  }
  el.style.display = "flex";
  el.innerHTML = `<div class="auth-card">
    <div class="auth-marca"><span>CM</span></div>
    <h1>Charles Miller</h1>
    <p class="auth-sub">App do Condomínio</p>
    ${conteudo}
  </div>`;
}
function fecharAuth(){
  const el = document.getElementById("authShell");
  if(el) el.style.display = "none";
}

function formEntrar(erro){
  telaAuth(`
    ${erro?`<div class="auth-erro">${erro}</div>`:''}
    <label>E-mail</label>
    <input id="auEmail" type="email" autocomplete="username" placeholder="seu@email.com">
    <label>Senha</label>
    <input id="auSenha" type="password" autocomplete="current-password" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')entrar()">
    <button class="auth-btn" onclick="entrar()">Entrar</button>
    <button class="auth-link" onclick="formCriar()">Criar conta</button>
  `);
  const e=document.getElementById("auEmail"); if(e) e.focus();
}

function formCriar(erro){
  telaAuth(`
    ${erro?`<div class="auth-erro">${erro}</div>`:''}
    <label>Nome completo</label>
    <input id="auNome" placeholder="Como aparece para o síndico">
    <label>Unidade</label>
    <input id="auUnidade" placeholder="Ex: 802-A" style="text-transform:uppercase">
    <label>E-mail</label>
    <input id="auEmail" type="email" autocomplete="username" placeholder="seu@email.com">
    <label>Senha</label>
    <input id="auSenha" type="password" autocomplete="new-password" placeholder="mínimo 8 caracteres"
           onkeydown="if(event.key==='Enter')criarConta()">
    <button class="auth-btn" onclick="criarConta()">Criar conta</button>
    <button class="auth-link" onclick="formEntrar()">Já tenho conta</button>
    <p class="auth-nota">A conta precisa ser liberada pelo síndico antes do primeiro acesso.</p>
  `);
  const e=document.getElementById("auNome"); if(e) e.focus();
}

function telaPendente(){
  telaAuth(`
    <div class="auth-aguardando">
      <div class="ic">⏳</div>
      <h2>Conta aguardando liberação</h2>
      <p>Olá, ${USUARIO.nome}. Seu cadastro foi registrado${USUARIO.unidade?` para a unidade <strong>${USUARIO.unidade}</strong>`:''},
      mas ainda precisa ser aprovado pelo síndico.</p>
      <p class="auth-nota">Assim que for liberado, basta entrar novamente.</p>
    </div>
    <button class="auth-btn" onclick="recarregarSessao()">Verificar de novo</button>
    <button class="auth-link" onclick="sair()">Sair</button>
  `);
}

async function entrar(){
  const email=(document.getElementById("auEmail").value||"").trim();
  const senha=document.getElementById("auSenha").value||"";
  if(!email||!senha){ formEntrar("Informe e-mail e senha."); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){ formEntrar(traduzErroAuth(error.message)); return; }
  await aposLogin();
}

async function criarConta(){
  const nome=(document.getElementById("auNome").value||"").trim();
  const unidade=(document.getElementById("auUnidade").value||"").trim().toUpperCase();
  const email=(document.getElementById("auEmail").value||"").trim();
  const senha=document.getElementById("auSenha").value||"";
  if(!nome){ formCriar("Informe seu nome."); return; }
  if(!email||!senha){ formCriar("Informe e-mail e senha."); return; }
  if(senha.length<8){ formCriar("A senha precisa ter ao menos 8 caracteres."); return; }

  const { error } = await sb.auth.signUp({
    email, password: senha,
    options: { data: { nome, unidade: unidade || null } }   // sobrevive à confirmação por e-mail
  });
  if(error){ formCriar(traduzErroAuth(error.message)); return; }

  // com "Confirm email" ligado o signUp não abre sessão; o registro
  // acontece no primeiro login, lendo nome e unidade do metadata
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    telaAuth(`
      <div class="auth-aguardando">
        <div class="ic">📧</div>
        <h2>Confirme seu e-mail</h2>
        <p>Enviamos um link para <strong>${email}</strong>. Abra e clique nele para
        ativar a conta.</p>
        <p class="auth-nota">Depois volte aqui e entre normalmente. Seu cadastro
        ${unidade?`para a unidade <strong>${unidade}</strong> `:''}ainda precisará
        da liberação do síndico.</p>
      </div>
      <button class="auth-btn" onclick="formEntrar()">Já confirmei, quero entrar</button>`);
    return;
  }
  const { error: e2 } = await sb.rpc("cm_registrar", { p_nome: nome, p_unidade: unidade || null });
  if(e2){ formCriar("Conta criada, mas o registro falhou: "+e2.message); return; }
  await aposLogin();
}

async function sair(){
  await sb.auth.signOut();
  USUARIO = null;
  location.reload();
}

async function recarregarSessao(){ await aposLogin(); }

function traduzErroAuth(msg){
  const m = (msg||"").toLowerCase();
  if(m.includes("invalid login")) return "E-mail ou senha incorretos.";
  if(m.includes("already registered")) return "Esse e-mail já tem conta. Use “Já tenho conta”.";
  if(m.includes("email not confirmed")) return "Confirme o e-mail antes de entrar.";
  if(m.includes("password")) return "Senha muito curta — use ao menos 8 caracteres.";
  return msg;
}

/* carrega o vínculo da conta e decide o que mostrar */
async function aposLogin(){
  const { data, error } = await sb.rpc("cm_eu");
  if(error){ formEntrar("Falha ao ler o perfil: "+error.message); return; }

  USUARIO = (data && data[0]) || null;

  if(!USUARIO){
    // conta existe no Auth mas ainda não se registrou — típico de quem
    // confirmou o e-mail depois. cm_registrar recupera nome e unidade
    // do metadata deixado no cadastro.
    const { error:e2 } = await sb.rpc("cm_registrar", {});
    if(e2){ formEntrar("Conta sem vínculo: "+e2.message); return; }
    const r = await sb.rpc("cm_eu");
    USUARIO = (r.data && r.data[0]) || null;
  }
  if(!USUARIO){ formEntrar("Não foi possível registrar a conta."); return; }
  if(!USUARIO.ativo){ telaPendente(); return; }

  fecharAuth();
  await iniciarApp();
}

/* carrega os dados e abre a interface do papel do usuário */
async function iniciarApp(){
  faixaStatus("Carregando dados…","carregando");
  try{
    await carregarTudo();
    ONLINE = true;
    const el=document.getElementById("statusDB");
    if(el) el.remove();
  }catch(e){
    console.error("[iniciarApp]", e);
    ONLINE = false;
    faixaStatus("⚠ Falha ao carregar os dados — nada será salvo "+
                "<button onclick=\"location.reload()\">Tentar de novo</button>","offline");
  }
  montarCabecalho();
  setRole(papelAtual()==="morador" ? "resident" : papelAtual());
}

async function boot(){
  if(!window.supabase){
    faixaStatus("⚠ Não foi possível carregar o app. Verifique sua conexão.","offline");
    return;
  }
  sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  const { data:{ session } } = await sb.auth.getSession();
  if(session) await aposLogin(); else formEntrar();
}

/* init */
boot();

/* ============================================================
   PWA — instalação e service worker
   ============================================================ */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}

let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner();
});
window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  hideInstallBanner();
});

async function showInstallBanner(){
  if (document.getElementById("installBanner")) return;
  if (window.matchMedia("(display-mode: standalone)").matches) return;
  const banner = document.createElement("div");
  banner.id = "installBanner";
  banner.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;max-width:436px;margin:0 auto;background:var(--navy-950);color:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:1000;";
  banner.innerHTML = `
    <div style="width:38px;height:38px;border-radius:10px;background:var(--gold-500);color:var(--navy-950);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;flex:none">CM</div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:13px">Instalar o app do Charles Miller</div>
      <div style="font-size:11.5px;color:#b9c2d6">Acesse direto da tela inicial, sem precisar do navegador</div>
    </div>
    <button id="installBtn" style="background:var(--gold-500);color:var(--navy-950);border:none;padding:9px 14px;border-radius:10px;font-weight:700;font-size:12px;flex:none">Instalar</button>
    <button id="dismissInstallBtn" style="background:none;border:none;color:#8ea0c4;font-size:18px;padding:0 4px;flex:none">×</button>
  `;
  document.body.appendChild(banner);
  document.getElementById("installBtn").onclick = async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    hideInstallBanner();
  };
  document.getElementById("dismissInstallBtn").onclick = hideInstallBanner;
}
function hideInstallBanner(){
  const b = document.getElementById("installBanner");
  if (b) b.remove();
}
</script>
